[mgr]
show_hidden = true

[opener]
play = [
	{ run = 'mpv %s', orphan = true, for = "linux" },
	{ run = 'D:\ProgramFiles\mpv.net\mpvnet.exe %*', orphan = true, for = "windows" },
]
edit = [
	{ run = '$EDITOR %s', block = true, for = "unix" },
	{ run = "%EDITOR% %*",  block = true, for = "windows" },
]
open = [
	{ run = 'xdg-open %s1', orphan = true, desc = "Open", for = "linux" },
	{ run = 'start "" %*', orphan = true, desc = "Open", for = "windows" },
	{ run = 'open %s', orphan = true, desc = "Open", for = "macos" },
]

[open]
prepend_rules = [
	{ url = "*/", use = "open" },
]

